[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
solc_version = "0.8.20"

# Enable optimizer — reduces gas on every relay call
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
arc_testnet = 'https://rpc.testnet.arc.network'

[etherscan]
arc_testnet = { key = "placeholder", url = "https://testnet.arcscan.app/api" }

# Remappings for forge-std
remappings = ["forge-std/=lib/forge-std/src/"]
